name: py312_s2grits
channels:
  - conda-forge
  - nodefaults

dependencies:
  # Match the CPython minor version used by S1-GRiTS for GDAL/rasterio compatibility.
  - python=3.12
  - pip

  # Prefer conda-forge binaries for the geospatial and array stack.
  - gdal
  - rasterio
  - pyproj
  - shapely
  - pyshp
  - numpy
  - xarray
  - zarr>=3,<4
  - pyarrow

  # Networking, configuration and runtime utilities.
  - requests
  - urllib3
  - pyyaml
  - tqdm
  - rich

  # Test tools.
  - pytest

  # After creating the environment, run from the repository: python -m pip install -e .
