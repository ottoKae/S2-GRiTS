workflow: "scenes"

roi:
  manual_mgrs_tiles: ["17MPU"]

time:
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  query_interval: "monthly"
  allow_recent: true

source:
  stac_api: "https://earth-search.aws.element84.com/v1"
  collection: "sentinel-2-c1-l2a"
  provider: "Element 84 Earth Search / AWS Open Data"
  cloud_cover_max: 20
  page_limit: 100
  request_timeout_seconds: 90
  max_retries: 4
  retry_backoff_seconds: 5
  read_mode: "local_cache_first"
  local_cache_on_read_failure: true

assets:
  resolution_mode: "native_groups"
  resampling: "none"
  bands:
    - "blue"      # B02, 10 m -> blue
    - "green"     # B03, 10 m -> green
    - "red"       # B04, 10 m -> red
    - "nir"       # B08, 10 m -> nir_broad
    - "rededge1"  # B05, 20 m -> red_edge_1
    - "rededge2"  # B06, 20 m -> red_edge_2
    - "rededge3"  # B07, 20 m -> red_edge_3
    - "nir08"     # B8A, 20 m -> nir_narrow
    - "swir16"    # B11, 20 m -> swir_1
    - "swir22"    # B12, 20 m -> swir_2
    - "scl"
    - "cloud"     # CLD -> cloud_probability
    - "coastal"   # B01, 60 m -> coastal
    - "nir09"     # B09, 60 m -> water_vapor

processing:
  monthly:
    enabled: false
  cloud_mask:
    enabled: false

output:
  base_dir: "D:/data/S2-GRiTS-17MPU-2024-test"
  logs_dir: "../logs"
  cache_dir: "../_cache"
  existing_store: "resume"
  formats:
    zarr: true
    cog: false
    preview: true
    raw_assets: false

runtime:
  chunk_size: 512
  read_retries: 4
  download_scene_workers: 1
  download_band_workers: 4
  downloader: "requests"
  max_tiles: 1
  max_scenes_per_tile: null
